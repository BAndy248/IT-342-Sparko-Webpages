<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sparko</title>
    <link rel="stylesheet" href="css/sparkoTemplate.css">
    <link rel="stylesheet" href="css/loginStyle.css">
    <link rel="icon" href="Images/SparkoIcon.svg">
</head>
<body>
    <header>
        <div class="home-page-button">
            <a href="index.html">Sparko</a>
        </div>
    </header>
    <div class="main-div">

        <div class="login-box">
            <div class="login-title">Login</div>

            <div id="error-msg" class="error-message"></div>

            <div class="login-container">
                <div class="login-label">Username: </div>
                <input type="text" id="username" class="login-input" autocomplete="username">
            </div>
            <div class="login-container">
                <div class="login-label">Password: </div>
                <input type="password" id="password" class="login-input" autocomplete="current-password">
            </div>

            <div class="login-button">
                <button class="submit-button" id="login-btn" onclick="handleLogin()">Submit</button>
            </div>

            <div class="switch-login-register">
                <p class="login-label">New user? <a href="register.html"><u>Register</u></a></p>
            </div>
            <div class="switch-login-register">
                <p class="login-label"><a href="forgot-password.html"><u>Forgot Password?</u></a></p>
            </div>
        </div>

        <div class="circles-bg">
            <div class="circle"></div>
            <div class="circle2"></div>
            <div class="circle3"></div>
        </div>

    </div>
    <div id="footer-mount"></div>

    <script src="js/api.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/toast.js"></script>
    <script>
        redirectIfLoggedIn();

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        async function handleLogin() {
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('error-msg');
            errEl.textContent = '';
            btn.disabled = true;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                errEl.textContent = 'Please fill in all fields.';
                btn.disabled = false;
                return;
            }

            try {
                const data = await api.post('/auth/login', { username, password });
                api.setToken(data.token);
                api.setUser(data.user);
                window.location.href = data.user.role === 'admin' ? '/admin/dashboard.html' : '/dashboard.html';
            } catch (err) {
                errEl.textContent = err.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
