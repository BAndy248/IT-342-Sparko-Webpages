<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management - Sparko Admin</title>
    <link rel="stylesheet" href="../css/sparkoTemplate.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="icon" href="../Images/SparkoIcon.svg">
</head>
<body>
    <header class="dashboard-header">
        <div class="logo"><a href="../index.html">Sparko</a> <span style="font-family:'Harabara',sans-serif; font-size:2vh; color:#FF72B1;">ADMIN</span></div>
        <nav class="dashboard-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="users.html">Users</a>
            <a href="orders.html" class="active">Orders</a>
            <a href="products.html">Products</a>
            <button class="logout-btn" onclick="api.logout()">Logout</button>
        </nav>
    </header>

    <div class="dashboard-content">
        <h1 class="page-title">Order Management</h1>

        <div class="filter-bar">
            <select id="status-filter" onchange="loadOrders()">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="out_for_delivery">Out for Delivery</option>
                <option value="delivered">Delivered</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>

        <div id="orders-container">
            <div class="empty-state"><p>Loading...</p></div>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Update Status Modal -->
    <div class="modal-overlay" id="order-modal">
        <div class="modal">
            <div class="modal-title">Order #<span id="modal-order-id"></span></div>
            <div id="modal-msg" class="error-message" style="text-align:left;"></div>
            <div id="modal-success" class="success-message" style="text-align:left;"></div>

            <div class="form-group">
                <label>Customer</label>
                <div id="modal-customer" style="font-family:'Harabara',sans-serif;"></div>
            </div>
            <div class="form-group">
                <label>Delivery Address</label>
                <div id="modal-address" style="font-family:'Harabara',sans-serif;"></div>
            </div>
            <div class="form-group">
                <label>Total</label>
                <div id="modal-total" style="font-family:'Harabara',sans-serif;"></div>
            </div>
            <div class="form-group">
                <label>Update Status</label>
                <select id="modal-status" style="padding:1vh; border-radius:6px; font-family:'Harabara',sans-serif; max-width:250px;">
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="out_for_delivery">Out for Delivery</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <div style="display:flex; gap:1vh; margin-top:2vh;">
                <button class="btn btn-primary" onclick="updateOrderStatus()">Update Status</button>
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <footer class="dashboard-footer">Sparko Water Delivery Service - Admin Panel</footer>

    <script src="../js/api.js"></script>
    <script>
        if (!requireAdmin()) throw new Error('redirect');

        let selectedOrderId = null;
        let ordersCache = {};  // Store order data safely in JS instead of inline HTML
        loadOrders();

        async function loadOrders(page = 1) {
            const status = document.getElementById('status-filter').value;
            const container = document.getElementById('orders-container');

            try {
                let url = '/admin/orders?page=' + page + '&limit=15';
                if (status) url += '&status=' + encodeURIComponent(status);

                const data = await api.get(url);
                ordersCache = {};

                if (data.orders.length === 0) {
                    container.innerHTML = '<div class="empty-state"><h3>No orders found</h3></div>';
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }

                let html = '<table class="data-table"><thead><tr>';
                html += '<th>ID</th><th>Customer</th><th>Date</th><th>Delivery</th><th>Status</th><th>Total</th><th>Action</th>';
                html += '</tr></thead><tbody>';

                for (const o of data.orders) {
                    // Cache order data in JS object — avoids injecting JSON into HTML attributes
                    ordersCache[o.id] = o;
                    html += '<tr>';
                    html += '<td>' + escapeHtml(String(o.id)) + '</td>';
                    html += '<td>' + escapeHtml(o.username) + '</td>';
                    html += '<td>' + escapeHtml(formatDate(o.created_at)) + '</td>';
                    html += '<td>' + escapeHtml(formatDate(o.delivery_date)) + '</td>';
                    html += '<td>' + statusBadge(o.status) + '</td>';
                    html += '<td>' + escapeHtml(formatCurrency(o.total)) + '</td>';
                    html += '<td><button class="btn btn-small btn-primary" onclick="openOrder(' + parseInt(o.id) + ')">Manage</button></td>';
                    html += '</tr>';
                }

                html += '</tbody></table>';
                container.innerHTML = html;

                // Pagination
                const pag = data.pagination;
                let pagHtml = '';
                pagHtml += '<button ' + (pag.page <= 1 ? 'disabled' : '') + ' onclick="loadOrders(' + (pag.page - 1) + ')">Prev</button>';
                for (let i = 1; i <= pag.pages; i++) {
                    pagHtml += '<button class="' + (i === pag.page ? 'active' : '') + '" onclick="loadOrders(' + i + ')">' + i + '</button>';
                }
                pagHtml += '<button ' + (pag.page >= pag.pages ? 'disabled' : '') + ' onclick="loadOrders(' + (pag.page + 1) + ')">Next</button>';
                document.getElementById('pagination').innerHTML = pagHtml;

            } catch (err) {
                container.innerHTML = '<div class="empty-state"><p>Error loading orders.</p></div>';
            }
        }

        function openOrder(id) {
            const order = ordersCache[id];
            if (!order) return;
            selectedOrderId = order.id;
            setText('modal-order-id', String(order.id));
            setText('modal-customer', order.username + ' (' + order.email + ')');
            setText('modal-total', formatCurrency(order.total));
            document.getElementById('modal-status').value = order.status;

            const addr = order.street
                ? order.street + ', ' + order.city + ', ' + order.state + ' ' + order.zip_code
                : 'No address';
            setText('modal-address', addr);

            document.getElementById('modal-msg').textContent = '';
            document.getElementById('modal-success').textContent = '';
            document.getElementById('order-modal').classList.add('active');
        }

        async function updateOrderStatus() {
            const errEl = document.getElementById('modal-msg');
            const successEl = document.getElementById('modal-success');
            errEl.textContent = '';
            successEl.textContent = '';

            const status = document.getElementById('modal-status').value;

            try {
                await api.put('/admin/orders/' + selectedOrderId + '/status', { status });
                successEl.textContent = 'Order status updated!';
                loadOrders();
            } catch (err) {
                errEl.textContent = err.message;
            }
        }

        function closeModal() {
            document.getElementById('order-modal').classList.remove('active');
        }
    </script>
</body>
</html>
