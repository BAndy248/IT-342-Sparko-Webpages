<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Sparko</title>
    <link rel="stylesheet" href="css/sparkoTemplate.css">
    <link rel="stylesheet" href="css/loginStyle.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="icon" href="Images/SparkoIcon.svg">
</head>
<body>
    <header>
        <div class="home-page-button">
            <a href="index.html">Sparko</a>
        </div>
    </header>
    <div class="main-div">

        <div class="login-box" style="min-height: 45vh;">
            <div class="login-title" style="font-size: 5vh;">New Pass</div>

            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>

            <div class="login-container">
                <div class="login-label">New Password: </div>
                <input type="password" id="password" class="login-input" autocomplete="new-password">
            </div>

            <div class="login-container">
                <div class="login-label">Confirm: </div>
                <input type="password" id="confirm" class="login-input" autocomplete="new-password">
            </div>

            <div class="login-button">
                <button class="submit-button" id="reset-btn" onclick="handleReset()">Reset</button>
            </div>

            <div class="switch-login-register">
                <p class="login-label"><a href="login.html"><u>Back to Login</u></a></p>
            </div>
        </div>

        <div class="circles-bg">
            <div class="circle"></div>
            <div class="circle2"></div>
            <div class="circle3"></div>
        </div>

    </div>
    <div id="footer-mount"></div>

    <script src="js/api.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/toast.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('error-msg').textContent = 'Invalid reset link. Please request a new one.';
            document.getElementById('reset-btn').disabled = true;
        }

        async function handleReset() {
            const btn = document.getElementById('reset-btn');
            const errEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');
            errEl.textContent = '';
            successEl.textContent = '';
            btn.disabled = true;

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (!password || !confirm) {
                errEl.textContent = 'Please fill in both fields.';
                btn.disabled = false;
                return;
            }

            if (password !== confirm) {
                errEl.textContent = 'Passwords do not match.';
                btn.disabled = false;
                return;
            }

            if (password.length < 8) {
                errEl.textContent = 'Password must be at least 8 characters.';
                btn.disabled = false;
                return;
            }

            try {
                const data = await api.post('/auth/reset-password', { token, password });
                successEl.textContent = data.message + ' Redirecting to login...';
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            } catch (err) {
                errEl.textContent = err.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
