<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Sparko</title>
    <link rel="stylesheet" href="css/sparkoTemplate.css">
    <link rel="stylesheet" href="css/loginStyle.css">
    <link rel="icon" href="Images/SparkoIcon.svg">
</head>
<body>
    <header>
        <div class="home-page-button">
            <a href="index.html">Sparko</a>
        </div>
    </header>
    <div class="main-div">

        <div class="login-box" style="min-height: 40vh;">
            <div class="login-title" style="font-size: 5vh;">Reset</div>

            <div id="error-msg" class="error-message"></div>
            <div id="success-msg" class="success-message"></div>

            <div class="login-container">
                <div class="login-label">Email: </div>
                <input type="email" id="email" class="login-input" autocomplete="email">
            </div>

            <div class="login-button">
                <button class="submit-button" id="reset-btn" onclick="handleForgot()">Send Reset</button>
            </div>

            <div class="switch-login-register">
                <p class="login-label">Remember it? <a href="login.html"><u>Login</u></a></p>
            </div>
        </div>

        <div class="circles-bg">
            <div class="circle"></div>
            <div class="circle2"></div>
            <div class="circle3"></div>
        </div>

    </div>
    <div id="footer-mount"></div>

    <script src="js/api.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/toast.js"></script>
    <script>
        async function handleForgot() {
            const btn = document.getElementById('reset-btn');
            const errEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');
            errEl.textContent = '';
            successEl.textContent = '';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            if (!email) {
                errEl.textContent = 'Please enter your email.';
                btn.disabled = false;
                return;
            }

            try {
                const data = await api.post('/auth/forgot-password', { email });
                successEl.textContent = data.message;

                // In dev mode, show the reset link
                if (data.resetToken) {
                    successEl.innerHTML = 'Token generated! <a href="reset-password.html?token=' +
                        encodeURIComponent(data.resetToken) +
                        '" style="color: #FF72B1;"><u>Click here to reset</u></a>';
                }
            } catch (err) {
                errEl.textContent = err.message;
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
