<!DOCTYPE html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="sparkoTemplate.css">
    <link rel="stylesheet" href="loginStyle.css">
    <link rel="icon" href="Images/SparkoIcon.svg">
</head>
<body>
    <header>
        <div class="home-page-button">
            <a href="index.html">Sparko</a>
        </div>
    </header>
    <div class="main-div">

        <div class="login-box">
            <div class="login-title">Login</div>

            <div class="login-container">
                <div class="login-label">Username: </div>
                <input type="text" id="User" class="login-input">
            </div>
            <div class="login-container">
                <div class="login-label">Password: </div>
                <input type="password" id="Pass" class="login-input">
            </div>

            <div class="login-button">
                <button class="submit-button">Submit</button>
            </div>

            <div class="switch-login-register">
                <p class="login-label">New user? <a href="register.html"><u>Register</u></a></p>
            </div>


        </div>

        <div class="container">
            <div class="circle"></div>
            <div class="circle2"></div>
            <div class="circle3"></div>
        </div>

    </div>
    <footer>

    </footer>
</body>
